<main>

    <h2>💬 Sua opinião é muito importante!</h2>

    <p>
        Envie seu feedback, sugestão, dúvida ou relate algum problema
        relacionado ao GPTNilson.
    </p>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="tipo">Tipo de feedback:</label><br>
        <select id="tipo" name="tipo">
            <option value="sugestao">Sugestão</option>
            <option value="duvida">Dúvida</option>
            <option value="problema">Relatar problema</option>
            <option value="elogio">Elogio</option>
            <option value="outro">Outro</option>
        </select>

        <br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" rows="8" cols="40"></textarea>

        <br><br>

        <button type="submit">Enviar feedback</button>

    </form>

</main>
